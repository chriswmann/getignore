[package]
name = "getignore-rs"
version = "0.2.0"
edition = "2024"
description = "Fetch a .gitignore template from the github/gitignore repository, with caching"
license = "GPL-3.0-or-later"
repository = "https://github.com/chriswmann/getignore"
readme = "README.md"
keywords = ["gitignore", "cli", "git", "template"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "string"] }
etcetera = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["std"] }
strsim = "0.11.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.3.0", features = ["json"] }

[profile.dev]
# Full DWARF packing dominates link time (~25s per edit); line tables keep
# panic backtraces useful and cut incremental rebuilds to ~1s.
debug = "line-tables-only"

[lints.clippy]
pedantic = "warn"
